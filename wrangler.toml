name = "kosu"
main = "src/index.ts"
compatibility_date = "2025-11-01"
# The workers.dev hostname stays off: the only public origin is kosu.0g0.xyz.
workers_dev = false

# Public domain. The custom domain automatically provisions its DNS record
# in the 0g0.xyz zone (same Cloudflare account) on deploy.
routes = [
  { pattern = "kosu.0g0.xyz", custom_domain = true },
]

# Secrets are set with `wrangler secret put` and never listed here:
# - SESSION_SECRET
# - FIELD_ENCRYPTION_KEY (base64-encoded 32-byte key for AES-GCM field encryption)
# The OIDC client is public (token_endpoint_auth_method "none" + PKCE), so
# there is no OIDC_CLIENT_SECRET.
[vars]
APP_ORIGIN = "https://kosu.0g0.xyz"
OIDC_ISSUER = "https://id.0g0.xyz"
# Registered via DCR (RFC 7591) on 2026-11-14; public client, PKCE S256, no secret.
OIDC_CLIENT_ID = "1c52afa2e94016e8d2953f7c3467f3b2"
OIDC_SCOPES = "openid profile email"

[[d1_databases]]
binding = "DB"
database_name = "kosu"
database_id = "1b97f4a1-9885-4c11-8bc9-e75bb2a5bd2f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kosu-files"
